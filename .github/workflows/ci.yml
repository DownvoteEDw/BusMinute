name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_PORT: 3000
      SITE_URL: http://127.0.0.1:3000
      POSTGRES_PASSWORD: busminute-ci-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:streaming
      - run: docker compose -f docker-compose.yaml -f compose.local.yaml -f compose.ci.yaml up --build --detach
      - run: |
          for attempt in {1..30}
          do
              if curl --fail --silent http://127.0.0.1:3000/api/health
              then
                  exit 0
              fi
              sleep 2
          done
          docker compose -f docker-compose.yaml -f compose.local.yaml -f compose.ci.yaml logs
          exit 1
      - name: Search API smoke test
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "http://127.0.0.1:3000/api/search?q=50819")"
          if [ "$status" != "200" ]
          then
              cat "$response_file"
              docker compose -f docker-compose.yaml -f compose.local.yaml -f compose.ci.yaml logs app worker
              exit 1
          fi
          if ! node -e 'const body = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.exit(body.journeys?.some((journey) => journey.serviceNumber === "50819") ? 0 : 1)' "$response_file"
          then
              cat "$response_file"
              docker compose -f docker-compose.yaml -f compose.local.yaml -f compose.ci.yaml logs app worker
              exit 1
          fi
      - name: Reject reports on an expired or unavailable journey
        run: |
          status="$(curl --silent --show-error \
              --output /tmp/busminute-report-response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"journeyRef":"50819:2026-08-22","stopId":"XPB","type":"BUS_ARRIVED","message":"GitHub CI"}' \
              http://127.0.0.1:3000/api/reports)"
          case "$status" in
              404|409) ;;
              *) cat /tmp/busminute-report-response.json; exit 1 ;;
          esac
      - run: docker compose -f docker-compose.yaml -f compose.local.yaml -f compose.ci.yaml run --rm migration
      - if: always()
        run: docker compose -f docker-compose.yaml -f compose.local.yaml -f compose.ci.yaml down --volumes
