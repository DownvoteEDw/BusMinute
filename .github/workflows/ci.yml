name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_PORT: 3000
      SITE_URL: http://127.0.0.1:3000
      POSTGRES_PASSWORD: busminute-ci-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker compose -f docker-compose.yaml -f compose.local.yaml up --build --detach
      - run: |
          for attempt in {1..30}
          do
              if curl --fail --silent http://127.0.0.1:3000/api/health
              then
                  exit 0
              fi
              sleep 2
          done
          docker compose -f docker-compose.yaml -f compose.local.yaml logs
          exit 1
      - run: curl --fail --silent "http://127.0.0.1:3000/api/search?q=50819"
      - run: |
          curl --fail --silent \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"journeyRef":"50819:2026-08-22","stopId":"XPB","type":"BUS_ARRIVED","message":"GitHub CI"}' \
              http://127.0.0.1:3000/api/reports
      - run: docker compose -f docker-compose.yaml -f compose.local.yaml run --rm migration
      - if: always()
        run: docker compose -f docker-compose.yaml -f compose.local.yaml down --volumes
