name: busminute

x-busminute-image: &busminute-image
  image: busminute:${IMAGE_TAG:-local}

x-busminute-environment: &busminute-environment
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: 3000
  SITE_URL: ${SITE_URL:?SITE_URL est requis}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-busminute}
  POSTGRES_USER: ${POSTGRES_USER:-busminute}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  GTFS_URL: ${GTFS_URL:-https://drive.google.com/uc?export=download&id=1VXd01yQl2Mb67C9bkrx0P8sqNIL532_o}
  FLIXBUS_GTFS_ENABLED: ${FLIXBUS_GTFS_ENABLED:-true}
  FLIXBUS_GTFS_URL: ${FLIXBUS_GTFS_URL:-https://gtfs.gis.flix.tech/gtfs_generic_eu.zip}
  FLIXBUS_GTFS_TIMEOUT_MS: ${FLIXBUS_GTFS_TIMEOUT_MS:-300000}
  FLIXBUS_REALTIME_ENABLED: ${FLIXBUS_REALTIME_ENABLED:-true}
  FLIXBUS_REALTIME_API_URL: ${FLIXBUS_REALTIME_API_URL:-https://global.api.flixbus.com/gis}
  FLIXBUS_TRACKER_URL: ${FLIXBUS_TRACKER_URL:-https://www.flixbus.fr/track}
  FLIXBUS_REALTIME_API_KEY: ${FLIXBUS_REALTIME_API_KEY:-}
  FLIXBUS_REALTIME_TIMEOUT_MS: ${FLIXBUS_REALTIME_TIMEOUT_MS:-12000}
  FLIXBUS_REALTIME_CACHE_SECONDS: ${FLIXBUS_REALTIME_CACHE_SECONDS:-30}
  ALSA_ENABLED: ${ALSA_ENABLED:-true}
  ALSA_LOCATIONS_URL: ${ALSA_LOCATIONS_URL:-https://global-api.distribusion.com/suggestion-service/v3/locations}
  ALSA_CONNECTIONS_URL: ${ALSA_CONNECTIONS_URL:-https://book.api.distribusion.com/api/connections}
  ALSA_TIMEOUT_MS: ${ALSA_TIMEOUT_MS:-30000}
  ALSA_LOCATION_LIMIT: ${ALSA_LOCATION_LIMIT:-500}
  ALSA_SERVICE_DAYS: ${ALSA_SERVICE_DAYS:-3}
  ALSA_CONCURRENCY: ${ALSA_CONCURRENCY:-4}
  ALSA_ORIGIN_BATCH_SIZE: ${ALSA_ORIGIN_BATCH_SIZE:-10}
  ALSA_DESTINATION_BATCH_SIZE: ${ALSA_DESTINATION_BATCH_SIZE:-70}
  ALSA_DESTINATION_COUNTRIES: ${ALSA_DESTINATION_COUNTRIES:-}
  ALSA_REALTIME_ENABLED: ${ALSA_REALTIME_ENABLED:-true}
  ALSA_REALTIME_TRACKER_URL: ${ALSA_REALTIME_TRACKER_URL:-https://www.alsa.com/fr/a-bord/localisez-votre-bus}
  ALSA_REALTIME_BUDGET_MS: ${ALSA_REALTIME_BUDGET_MS:-5000}
  ALSA_REALTIME_TIMEOUT_MS: ${ALSA_REALTIME_TIMEOUT_MS:-15000}
  ALSA_REALTIME_CACHE_SECONDS: ${ALSA_REALTIME_CACHE_SECONDS:-30}
  ALSA_REALTIME_LOCATION_CACHE_SECONDS: ${ALSA_REALTIME_LOCATION_CACHE_SECONDS:-21600}
  ALSA_REALTIME_SESSION_SECONDS: ${ALSA_REALTIME_SESSION_SECONDS:-600}
  ALSA_REALTIME_CONCURRENCY: ${ALSA_REALTIME_CONCURRENCY:-2}
  ALSA_REALTIME_BEFORE_DEPARTURE_MINUTES: ${ALSA_REALTIME_BEFORE_DEPARTURE_MINUTES:-120}
  ALSA_REALTIME_AFTER_ARRIVAL_MINUTES: ${ALSA_REALTIME_AFTER_ARRIVAL_MINUTES:-360}
  SIRI_URL: ${SIRI_URL:-https://open-data.bus.blablacar.com/api/siri-lite/estimated-timetable}
  REALTIME_SYNC_INTERVAL_SECONDS: ${REALTIME_SYNC_INTERVAL_SECONDS:-60}
  GTFS_SYNC_INTERVAL_HOURS: ${GTFS_SYNC_INTERVAL_HOURS:-24}
  HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-90}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-busminute}
      POSTGRES_USER: ${POSTGRES_USER:-busminute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - busminute-postgres:/var/lib/postgresql/data

  migration:
    <<: *busminute-image
    restart: "no"
    environment: *busminute-environment
    command:
      - node
      - dist/src/cli/migrate.js
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *busminute-image
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *busminute-environment
    depends_on:
      migration:
        condition: service_completed_successfully
    expose:
      - "3000"

  worker:
    <<: *busminute-image
    restart: unless-stopped
    environment: *busminute-environment
    command:
      - node
      - dist/src/cli/sync-worker.js
    healthcheck:
      disable: true
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  busminute-postgres:
