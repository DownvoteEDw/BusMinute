name: busminute

x-busminute-image: &busminute-image
  image: busminute:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile

x-busminute-environment: &busminute-environment
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: 3000
  SITE_URL: ${SITE_URL:?SITE_URL est requis}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-busminute}
  POSTGRES_USER: ${POSTGRES_USER:-busminute}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  GTFS_URL: ${GTFS_URL:-https://drive.google.com/uc?export=download&id=1VXd01yQl2Mb67C9bkrx0P8sqNIL532_o}
  SIRI_URL: ${SIRI_URL:-https://open-data.bus.blablacar.com/api/siri-lite/estimated-timetable}
  REALTIME_SYNC_INTERVAL_SECONDS: ${REALTIME_SYNC_INTERVAL_SECONDS:-60}
  GTFS_SYNC_INTERVAL_HOURS: ${GTFS_SYNC_INTERVAL_HOURS:-24}
  HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-90}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-busminute}
      POSTGRES_USER: ${POSTGRES_USER:-busminute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - busminute-postgres:/var/lib/postgresql/data

  migration:
    <<: *busminute-image
    restart: "no"
    environment: *busminute-environment
    command:
      - node
      - dist/src/cli/migrate.js
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *busminute-image
    restart: unless-stopped
    environment: *busminute-environment
    depends_on:
      migration:
        condition: service_completed_successfully
    expose:
      - "3000"

  worker:
    <<: *busminute-image
    restart: unless-stopped
    environment: *busminute-environment
    command:
      - node
      - dist/src/cli/sync-worker.js
    healthcheck:
      disable: true
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  busminute-postgres:
